<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KUKI GYMRATS | トレーニング管理システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    background: radial-gradient(circle at 50% -10%, #23262f 0%, #0f1115 55%);
    min-height: 100vh;
  }
  .role-card {
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .role-card:active { transform: scale(0.97); }
  .role-card:hover { border-color: var(--kuki-red); }
</style>
</head>
<body class="min-h-screen text-white">
  <div class="max-w-md mx-auto min-h-screen flex flex-col px-5 py-10">

    <header class="flex flex-col items-center mb-10">
      <div class="relative mb-4">
        <img src="images/logo.png" alt="KUKI GYMRATS ロゴ" class="w-24 h-24 rounded-2xl shadow-xl object-cover ring-2 ring-[var(--kuki-red)]/30">
      </div>
      <h1 class="font-display text-3xl font-bold tracking-wide mb-1">KUKI GYMRATS</h1>
      <p class="text-gray-400 text-sm">ウエイトトレーニング管理システム</p>
      <p class="text-gray-600 text-xs mt-1">〜日本一への軌跡〜</p>
    </header>

    <main class="flex-1 flex flex-col gap-5">

      <!-- ローディング状態 -->
      <div id="loading-state" class="flex flex-col items-center justify-center py-12 gap-3">
        <div class="w-8 h-8 border-2 border-[var(--kuki-red)] border-t-transparent rounded-full animate-spin"></div>
        <p class="text-gray-400 text-sm">ユーザーデータを読み込み中...</p>
      </div>

      <!-- コンテンツ（非表示→読み込み後に表示） -->
      <div id="main-content" class="hidden flex flex-col gap-5">
        <p class="text-gray-400 text-sm text-center">ログインするユーザーを選択してください</p>

        <!-- コーチ・トレーナー -->
        <section>
          <h2 class="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wider">
            <i class="fa-solid fa-user-shield mr-1 text-[var(--kuki-red)]"></i>コーチ・トレーナー
          </h2>
          <div id="staff-list" class="flex flex-col gap-2.5"></div>
        </section>

        <!-- 選手 -->
        <section>
          <h2 class="text-xs font-semibold text-gray-500 mb-2 uppercase tracking-wider">
            <i class="fa-solid fa-person-running mr-1 text-[var(--kuki-red)]"></i>選手
            <span id="player-count-badge" class="ml-1 px-1.5 py-0.5 rounded-full bg-gray-700 text-gray-300 text-[10px] font-normal normal-case"></span>
          </h2>
          <div class="relative mb-3">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input id="player-search" type="text" placeholder="選手名・背番号で検索" class="w-full bg-[#1f2229] border border-gray-700 rounded-xl pl-9 pr-3 py-3 text-sm focus:outline-none focus:border-[var(--kuki-red)] transition-colors">
          </div>
          <div id="player-list" class="grid grid-cols-2 gap-2.5 max-h-[42vh] overflow-y-auto no-scrollbar pb-2"></div>
          <div id="player-empty" class="hidden text-center text-gray-500 text-sm py-6">
            <i class="fa-solid fa-search mr-1"></i>該当する選手がいません
          </div>
        </section>
      </div>

      <!-- エラー状態 -->
      <div id="error-state" class="hidden flex-col items-center justify-center py-12 gap-3">
        <i class="fa-solid fa-triangle-exclamation text-red-400 text-3xl"></i>
        <p class="text-red-400 text-sm text-center">データの取得に失敗しました。<br>しばらくしてから再度お試しください。</p>
        <button onclick="init()" class="bg-[var(--kuki-red)] rounded-lg px-4 py-2 text-sm">再試行</button>
      </div>
    </main>

    <footer class="text-center text-gray-700 text-xs mt-8 pt-4 border-t border-gray-800/50">
      &copy; 2026 KUKI GYMRATS — Demo App
    </footer>
  </div>

<script src="js/api.js"></script>
<script>
let allUsers = [];

async function init() {
  document.getElementById('loading-state').classList.remove('hidden');
  document.getElementById('main-content').classList.add('hidden');
  document.getElementById('error-state').classList.add('hidden');

  try {
    allUsers = await Api.listAll('users');
  } catch (e) {
    console.error(e);
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('error-state').classList.remove('hidden');
    document.getElementById('error-state').classList.add('flex');
    return;
  }

  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('main-content').classList.remove('hidden');
  document.getElementById('main-content').classList.add('flex');

  renderStaff();
  renderPlayers('');
}

function renderStaff() {
  const staff = allUsers.filter(u => u.role === 'coach' || u.role === 'trainer');
  const el = document.getElementById('staff-list');
  el.innerHTML = staff.map(u => `
    <button onclick="loginAs('${u.id}')" class="role-card w-full flex items-center gap-3 bg-[#1f2229] border border-gray-700 rounded-xl p-4 text-left">
      <div class="w-11 h-11 rounded-full bg-[var(--kuki-red)] flex items-center justify-center font-bold text-lg flex-shrink-0">
        ${u.name.charAt(0)}
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold">${u.name}</div>
        <div class="text-xs text-gray-400">
          <i class="fa-solid ${u.role === 'coach' ? 'fa-chalkboard-user' : 'fa-stethoscope'} mr-1"></i>
          ${u.role === 'coach' ? 'コーチ' : 'トレーナー'} &mdash; PCダッシュボード
        </div>
      </div>
      <i class="fa-solid fa-chevron-right text-gray-600"></i>
    </button>
  `).join('');
}

function renderPlayers(filter) {
  // 在籍中の選手のみ（active !== false）
  const players = allUsers.filter(u => u.role === 'player' && u.active !== false);
  const filtered = players.filter(u =>
    u.name.includes(filter) || String(u.jersey_number ?? '').includes(filter)
  ).sort((a,b) => (a.jersey_number||0) - (b.jersey_number||0));

  // バッジ更新
  document.getElementById('player-count-badge').textContent = `${filtered.length}名`;

  const el = document.getElementById('player-list');
  const emptyEl = document.getElementById('player-empty');

  if (filtered.length === 0) {
    el.classList.add('hidden');
    emptyEl.classList.remove('hidden');
    return;
  }
  el.classList.remove('hidden');
  emptyEl.classList.add('hidden');

  el.innerHTML = filtered.map(u => `
    <button onclick="loginAs('${u.id}')" class="role-card flex items-center gap-2 bg-[#1f2229] border border-gray-700 rounded-xl p-3 text-left ${u.rehab_phase_id ? 'alert-card' : ''}">
      <div class="w-10 h-10 rounded-full ${u.rehab_phase_id ? 'bg-amber-500/80' : 'bg-gray-700'} flex items-center justify-center font-bold text-sm flex-shrink-0">
        ${u.jersey_number ?? '?'}
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-medium text-sm truncate">${u.name}</div>
        <div class="text-[10px] text-gray-400 truncate">
          ${u.position ? u.position + (u.rehab_phase_id ? ' ・ ' : '') : ''}${u.rehab_phase_id ? '<span class="text-amber-400">リハビリ中</span>' : ''}
        </div>
      </div>
    </button>
  `).join('');
}

function loginAs(userId) {
  const user = allUsers.find(u => u.id === userId);
  if (!user) return;
  if (user.active === false) {
    alert('このアカウントは無効です');
    return;
  }
  Session.setUser(user);
  if (user.role === 'player') {
    location.href = 'player.html';
  } else {
    location.href = 'dashboard.html';
  }
}

document.getElementById('player-search').addEventListener('input', (e) => {
  renderPlayers(e.target.value.trim());
});

init();
</script>
</body>
</html>
